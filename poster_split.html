<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Quảng Cáo Tối Giản — AloPremium.Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #111116;
      --card-ui: #1A1A22;
      --border-ui: rgba(255, 255, 255, 0.12);
      --text-ui: #F8FAFC;
      --muted-ui: #94A3B8;
      --accent: #FFB800;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top center, #1F1C14 0%, var(--bg-page) 55%);
      color: var(--text-ui);
      min-height: 100vh;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .studio-wrap {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .studio-head {
      text-align: center;
      max-width: 640px;
    }
    .studio-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 184, 0, 0.14);
      border: 1px solid rgba(255, 184, 0, 0.35);
      color: #FFD54F;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .studio-head h1 {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .studio-head p {
      font-size: 13px;
      color: var(--muted-ui);
      line-height: 1.5;
    }
    .toolbar {
      width: 100%;
      background: var(--card-ui);
      border: 1px solid var(--border-ui);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .ctrl-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .ctrl-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-ui);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-right: 4px;
    }
    .pill-btn {
      border: 1px solid var(--border-ui);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-ui);
      padding: 8px 14px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .pill-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .pill-btn.active {
      background: var(--accent);
      color: #181307;
      border-color: var(--accent);
      font-weight: 800;
    }
    .btn-download {
      border: none;
      background: linear-gradient(135deg, #FFB800 0%, #FF8A00 100%);
      color: #1A1405;
      padding: 10px 20px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 184, 0, 0.32);
      transition: transform 0.15s ease, filter 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-download:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-download:active { transform: translateY(0); }
    .preview-shell {
      width: 100%;
      max-width: 560px;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--border-ui);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65);
      background: #000;
    }
    .preview-shell.story { max-width: 420px; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="studio-wrap">
    <div class="studio-head">
      <div class="studio-badge">✨ Clean Bento Poster • Xuất PNG Nét Cao 2K</div>
      <h1>Áp Phích Quảng Cáo AloPremium.Shop</h1>
      <p>Giao diện tối giản hiện đại, tập trung làm nổi bật Locket Gold VIP, Spotify Premium, Combo Duo và VIP All-in-One với bảng giá chính xác từ hệ thống.</p>
    </div>

    <div class="toolbar">
      <div class="ctrl-group">
        <span class="ctrl-label">Giao diện:</span>
        <button type="button" class="pill-btn active" id="themeBtn_light" onclick="setTheme('light')">☀️ Sáng Tối Giản</button>
        <button type="button" class="pill-btn" id="themeBtn_dark" onclick="setTheme('dark')">🌙 Tối Sang Trọng</button>
      </div>

      <div class="ctrl-group">
        <span class="ctrl-label">Khổ ảnh:</span>
        <button type="button" class="pill-btn active" id="ratioBtn_post" onclick="setRatio('post')">🖼️ Bài Đăng (4:5)</button>
        <button type="button" class="pill-btn" id="ratioBtn_story" onclick="setRatio('story')">📱 Story / TikTok (9:16)</button>
      </div>

      <button type="button" class="btn-download" onclick="downloadPosterPng()">
        <span>📥</span> Tải Ảnh Poster PNG (2K)
      </button>
    </div>

    <div class="preview-shell" id="previewShell">
      <canvas id="posterCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    const STATE = {
      theme: 'light', // 'light' | 'dark'
      ratio: 'post',  // 'post' (4:5 -> 1080x1350 @2x) | 'story' (9:16 -> 1080x1920 @2x)
    };

    const THEMES = {
      light: {
        bg: '#FCF9F0',
        glowL: 'rgba(255, 184, 0, 0.16)',
        glowR: 'rgba(29, 185, 84, 0.13)',
        ink: '#181512',
        muted: '#6B6257',
        subtle: '#9A8F80',
        pillBg: '#FFFFFF',
        pillBorder: '#E7DEC8',
        cardBg: '#FFFFFF',
        cardBorder: '#E9DFC9',
        subCardBg: '#FAF6EB',
        subCardBorder: '#ECE2CA',
        footerBg: '#181512',
        footerText: '#FFFFFF',
        footerMuted: '#C7BFB2',
        locketAccent: '#D97706',
        locketSoft: '#FFF6DC',
        locketBorder: '#F5C451',
        spotifyAccent: '#15803D',
        spotifySoft: '#EBF9F0',
        spotifyBorder: '#86EFAC',
        comboAccent: '#B45309',
        comboSoft: '#FFF7ED',
        comboBorder: '#FDBA74',
        allAccent: '#6D28D9',
        allSoft: '#F5F3FF',
        allBorder: '#C4B5FD',
      },
      dark: {
        bg: '#0E0F14',
        glowL: 'rgba(255, 184, 0, 0.18)',
        glowR: 'rgba(29, 185, 84, 0.15)',
        ink: '#F8FAFC',
        muted: '#A1A1AA',
        subtle: '#71717A',
        pillBg: '#171922',
        pillBorder: '#2A2D3B',
        cardBg: '#151720',
        cardBorder: '#272A38',
        subCardBg: '#1C1F2B',
        subCardBorder: '#2E3244',
        footerBg: '#171923',
        footerText: '#FFFFFF',
        footerMuted: '#A1A1AA',
        locketAccent: '#FFB800',
        locketSoft: 'rgba(255, 184, 0, 0.12)',
        locketBorder: 'rgba(255, 184, 0, 0.45)',
        spotifyAccent: '#22C55E',
        spotifySoft: 'rgba(34, 197, 94, 0.12)',
        spotifyBorder: 'rgba(34, 197, 94, 0.42)',
        comboAccent: '#FB923C',
        comboSoft: 'rgba(251, 146, 60, 0.12)',
        comboBorder: 'rgba(251, 146, 60, 0.42)',
        allAccent: '#A78BFA',
        allSoft: 'rgba(167, 139, 250, 0.12)',
        allBorder: 'rgba(167, 139, 250, 0.42)',
      }
    };

    const FONT_SANS = '"Be Vietnam Pro", system-ui, -apple-system, sans-serif';
    const FONT_DISPLAY = '"Fredoka", "Be Vietnam Pro", system-ui, sans-serif';

    function setTheme(t) {
      STATE.theme = t;
      document.getElementById('themeBtn_light').classList.toggle('active', t === 'light');
      document.getElementById('themeBtn_dark').classList.toggle('active', t === 'dark');
      renderPoster();
    }

    function setRatio(r) {
      STATE.ratio = r;
      document.getElementById('ratioBtn_post').classList.toggle('active', r === 'post');
      document.getElementById('ratioBtn_story').classList.toggle('active', r === 'story');
      document.getElementById('previewShell').classList.toggle('story', r === 'story');
      renderPoster();
    }

    function roundPath(x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
      ctx.lineTo(x + rad, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
      ctx.lineTo(x, y + rad);
      ctx.quadraticCurveTo(x, y, x + rad, y);
      ctx.closePath();
    }

    function fillStrokeCard(x, y, w, h, r, fill, stroke, lineW = 2, shadowColor = null) {
      ctx.save();
      if (shadowColor) {
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur = 28;
        ctx.shadowOffsetY = 10;
      }
      roundPath(x, y, w, h, r);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.restore();

      if (stroke) {
        ctx.save();
        roundPath(x, y, w, h, r);
        ctx.lineWidth = lineW;
        ctx.strokeStyle = stroke;
        ctx.stroke();
        ctx.restore();
      }
    }

    // Icon Vector: Locket Gold (Nền vàng bo góc + Trái tim trắng)
    function drawLocketIcon(cx, cy, size) {
      const x = cx - size / 2;
      const y = cy - size / 2;
      ctx.save();
      const g = ctx.createLinearGradient(x, y, x + size, y + size);
      g.addColorStop(0, '#FFD43B');
      g.addColorStop(1, '#F59E0B');
      roundPath(x, y, size, size, size * 0.28);
      ctx.fillStyle = g;
      ctx.fill();

      // White heart inside
      ctx.fillStyle = '#FFFFFF';
      const s = size * 0.25;
      ctx.beginPath();
      ctx.moveTo(cx, cy + s * 1.15);
      ctx.bezierCurveTo(cx - s * 1.9, cy + s * 0.05, cx - s * 1.4, cy - s * 1.3, cx, cy - s * 0.42);
      ctx.bezierCurveTo(cx + s * 1.4, cy - s * 1.3, cx + s * 1.9, cy + s * 0.05, cx, cy + s * 1.15);
      ctx.fill();
      ctx.restore();
    }

    // Icon Vector: Spotify (Tròn xanh + 3 sóng trắng)
    function drawSpotifyIcon(cx, cy, size) {
      const r = size / 2;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#1DB954';
      ctx.fill();

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineCap = 'round';
      const arcs = [
        { dy: -r * 0.16, rad: r * 0.85, w: r * 0.16, a0: -2.08, a1: -1.04 },
        { dy: r * 0.12,  rad: r * 0.7,  w: r * 0.14, a0: -2.05, a1: -1.07 },
        { dy: r * 0.38,  rad: r * 0.56, w: r * 0.12, a0: -2.02, a1: -1.10 },
      ];
      arcs.forEach(a => {
        ctx.lineWidth = a.w;
        ctx.beginPath();
        ctx.arc(cx, cy + a.dy + r * 0.5, a.rad, a.a0, a.a1);
        ctx.stroke();
      });
      ctx.restore();
    }

    // Icon Vector: Crown (Combo Duo)
    function drawCrownIcon(cx, cy, size) {
      const x = cx - size / 2;
      const y = cy - size / 2;
      ctx.save();
      const g = ctx.createLinearGradient(x, y, x + size, y + size);
      g.addColorStop(0, '#FFB800');
      g.addColorStop(1, '#EA580C');
      roundPath(x, y, size, size, size * 0.28);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      const w = size * 0.56;
      const h = size * 0.38;
      const lx = cx - w / 2;
      const by = cy + h * 0.45;
      ctx.beginPath();
      ctx.moveTo(lx, by);
      ctx.lineTo(lx, cy - h * 0.3);
      ctx.lineTo(cx - w * 0.22, cy + h * 0.02);
      ctx.lineTo(cx, cy - h * 0.55);
      ctx.lineTo(cx + w * 0.22, cy + h * 0.02);
      ctx.lineTo(lx + w, cy - h * 0.3);
      ctx.lineTo(lx + w, by);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Icon Vector: Sparkle (All-in-One)
    function drawSparkleIcon(cx, cy, size) {
      const x = cx - size / 2;
      const y = cy - size / 2;
      ctx.save();
      const g = ctx.createLinearGradient(x, y, x + size, y + size);
      g.addColorStop(0, '#8B5CF6');
      g.addColorStop(1, '#EC4899');
      roundPath(x, y, size, size, size * 0.28);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      const s = size * 0.3;
      ctx.beginPath();
      ctx.moveTo(cx, cy - s);
      ctx.quadraticCurveTo(cx, cy, cx + s, cy);
      ctx.quadraticCurveTo(cx, cy, cx, cy + s);
      ctx.quadraticCurveTo(cx, cy, cx - s, cy);
      ctx.quadraticCurveTo(cx, cy, cx, cy - s);
      ctx.fill();
      ctx.restore();
    }

    function drawCheckLine(x, y, text, colorAccent, textColor, fontSize = 18) {
      ctx.save();
      ctx.fillStyle = colorAccent;
      ctx.beginPath();
      ctx.arc(x + 9, y - 5, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x + 5, y - 5);
      ctx.lineTo(x + 8, y - 2);
      ctx.lineTo(x + 13.5, y - 8.5);
      ctx.stroke();

      ctx.fillStyle = textColor;
      ctx.font = `600 ${fontSize}px ${FONT_SANS}`;
      ctx.textAlign = 'left';
      ctx.fillText(text, x + 26, y);
      ctx.restore();
    }

    function drawPricePillsGrid(x, y, w, items, subBg, subBorder, ink, accentColor, isTwoByTwo = true) {
      const gap = 10;
      const cols = isTwoByTwo ? 2 : items.length;
      const cellW = (w - gap * (cols - 1)) / cols;
      const cellH = 56;
      items.forEach((it, idx) => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const cx = x + col * (cellW + gap);
        const cy = y + row * (cellH + gap);
        fillStrokeCard(cx, cy, cellW, cellH, 14, subBg, subBorder, 1.5);

        ctx.textAlign = 'left';
        ctx.fillStyle = ink;
        ctx.font = `700 14px ${FONT_SANS}`;
        ctx.fillText(it.label, cx + 14, cy + 23);

        ctx.fillStyle = accentColor;
        ctx.font = `800 18px ${FONT_SANS}`;
        ctx.fillText(it.price, cx + 14, cy + 45);
      });
    }

    function renderPoster() {
      const W = 1080;
      const H = STATE.ratio === 'story' ? 1920 : 1350;
      const DPR = 2; // Render 2K nét căng

      canvas.width = W * DPR;
      canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      const T = THEMES[STATE.theme];
      const isStory = STATE.ratio === 'story';
      const pad = 48;
      const shadow = STATE.theme === 'light' ? 'rgba(24, 21, 18, 0.06)' : 'rgba(0, 0, 0, 0.35)';

      // 1. Nền sạch + Ánh sáng nhẹ 2 góc
      ctx.fillStyle = T.bg;
      ctx.fillRect(0, 0, W, H);

      const g1 = ctx.createRadialGradient(180, 180, 10, 180, 180, 480);
      g1.addColorStop(0, T.glowL);
      g1.addColorStop(1, 'transparent');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);

      const g2 = ctx.createRadialGradient(W - 180, 220, 10, W - 180, 220, 480);
      g2.addColorStop(0, T.glowR);
      g2.addColorStop(1, 'transparent');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, W, H);

      // 2. HEADER TỐI GIẢN
      let curY = isStory ? 112 : 54;

      // Brand pill
      fillStrokeCard(W / 2 - 150, curY, 300, 38, 19, T.pillBg, T.pillBorder, 1.5);
      ctx.textAlign = 'center';
      ctx.fillStyle = T.locketAccent;
      ctx.font = `800 15px ${FONT_SANS}`;
      ctx.fillText('● ALOPREMIUM.SHOP • CHÍNH HÃNG', W / 2, curY + 24);
      curY += 62;

      // Headline
      ctx.fillStyle = T.ink;
      ctx.font = `900 ${isStory ? 54 : 46}px ${FONT_SANS}`;
      ctx.fillText('Nâng Cấp Locket & Spotify', W / 2, curY + 34);
      curY += 54;

      ctx.fillStyle = T.muted;
      ctx.font = `600 18px ${FONT_SANS}`;
      ctx.fillText('Không mật khẩu / iCloud  •  Kích hoạt 30 giây  •  Cài 1 chạm qua Safari', W / 2, curY + 18);
      curY += isStory ? 56 : 44;

      // 3. HÀNG 1 (2 CỘT LỚN): LOCKET GOLD VIP & SPOTIFY PREMIUM
      const colGap = 24;
      const halfW = (W - pad * 2 - colGap) / 2;
      const topCardH = isStory ? 620 : 472;

      // --- CARD TRÁI: LOCKET GOLD VIP ---
      const lx = pad;
      fillStrokeCard(lx, curY, halfW, topCardH, 28, T.cardBg, T.locketBorder, 2.2, shadow);
      fillStrokeCard(lx + halfW - 148, curY + 20, 126, 28, 14, T.locketSoft, T.locketBorder, 1.2);
      ctx.textAlign = 'center';
      ctx.fillStyle = T.locketAccent;
      ctx.font = `800 12px ${FONT_SANS}`;
      ctx.fillText('BÁN CHẠY NHẤT', lx + halfW - 85, curY + 38);

      drawLocketIcon(lx + 54, curY + 54, 56);
      ctx.textAlign = 'left';
      ctx.fillStyle = T.ink;
      ctx.font = `900 28px ${FONT_SANS}`;
      ctx.fillText('Locket Gold VIP', lx + 96, curY + 52);
      ctx.fillStyle = T.locketAccent;
      ctx.font = `700 14px ${FONT_SANS}`;
      ctx.fillText('Mở khóa 100% tính năng VIP', lx + 96, curY + 74);

      // Lưới giá 4 gói Locket
      drawPricePillsGrid(
        lx + 24, curY + 102, halfW - 48,
        [
          { label: 'Test 3 Ngày', price: '5.000đ' },
          { label: '6 Tháng', price: '40.000đ' },
          { label: '1 Năm', price: '60.000đ' },
          { label: 'Vĩnh Viễn', price: '160.000đ' },
        ],
        T.subCardBg, T.subCardBorder, T.muted, T.locketAccent, true
      );

      // Tính năng Locket
      const lkFeats = [
        'Quay video 60s & đăng ảnh 4K gốc',
        '79+ Khung mẫu & tạo khung riêng',
        '5 Caption SF Symbols + 28 LUT màu',
        'Bạn bè vô hạn, không quảng cáo',
      ];
      let fyL = curY + (isStory ? 276 : 254);
      const featStep = isStory ? 56 : 39;
      lkFeats.forEach(ft => {
        drawCheckLine(lx + 26, fyL, ft, '#F59E0B', T.ink, isStory ? 17 : 15.5);
        fyL += featStep;
      });

      // Thanh cam kết đáy thẻ Locket
      const badgeBotH = isStory ? 54 : 42;
      const badgeBotY = curY + topCardH - badgeBotH - 22;
      fillStrokeCard(lx + 24, badgeBotY, halfW - 48, badgeBotH, 14, T.locketSoft, T.locketBorder, 1.2);
      ctx.textAlign = 'center';
      ctx.fillStyle = T.locketAccent;
      ctx.font = `700 ${isStory ? 15 : 13.5}px ${FONT_SANS}`;
      ctx.fillText('🛡️ Bảo hành 1 đổi 1 suốt thời gian dùng', lx + halfW / 2, badgeBotY + (badgeBotH / 2 + 5));

      // --- CARD PHẢI: SPOTIFY PREMIUM ---
      const rx = pad + halfW + colGap;
      fillStrokeCard(rx, curY, halfW, topCardH, 28, T.cardBg, T.spotifyBorder, 2.2, shadow);
      fillStrokeCard(rx + halfW - 148, curY + 20, 126, 28, 14, T.spotifySoft, T.spotifyBorder, 1.2);
      ctx.textAlign = 'center';
      ctx.fillStyle = T.spotifyAccent;
      ctx.font = `800 12px ${FONT_SANS}`;
      ctx.fillText('LOSSLESS AUDIO', rx + halfW - 85, curY + 38);

      drawSpotifyIcon(rx + 54, curY + 54, 56);
      ctx.textAlign = 'left';
      ctx.fillStyle = T.ink;
      ctx.font = `900 28px ${FONT_SANS}`;
      ctx.fillText('Spotify Premium', rx + 96, curY + 52);
      ctx.fillStyle = T.spotifyAccent;
      ctx.font = `700 14px ${FONT_SANS}`;
      ctx.fillText('Nghe nhạc không quảng cáo', rx + 96, curY + 74);

      // Lưới giá 4 gói Spotify
      drawPricePillsGrid(
        rx + 24, curY + 102, halfW - 48,
        [
          { label: 'Test 3 Ngày', price: '5.000đ' },
          { label: '6 Tháng', price: '40.000đ' },
          { label: '1 Năm', price: '60.000đ' },
          { label: 'Vĩnh Viễn', price: '180.000đ' },
        ],
        T.subCardBg, T.subCardBorder, T.muted, T.spotifyAccent, true
      );

      // Tính năng Spotify
      const spFeats = [
        'Âm thanh Lossless chuẩn cao cấp',
        'Chặn 100% quảng cáo âm thanh/banner',
        'Tua bài & chọn bài không giới hạn',
        'Reset IP đổi iPhone mới miễn phí 24/7',
      ];
